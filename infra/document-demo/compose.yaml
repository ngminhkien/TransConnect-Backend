name: transconnect-document-demo
services:
  aistor:
    image: ${AISTOR_IMAGE:-quay.io/minio/aistor/minio:latest}
    restart: "no"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    command: ["minio", "server", "/mnt/data", "--console-address", ":9001", "--license", "/minio.license"]
    volumes:
      - demo-data:/mnt/data
      - type: bind
        source: ./minio.license
        target: /minio.license
        read_only: true
        bind:
          create_host_path: false
volumes:
  demo-data:
