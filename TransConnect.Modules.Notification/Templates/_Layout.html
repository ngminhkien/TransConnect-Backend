<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{{Subject}}</title>
  <!--
    Quy tắc bắt buộc khi sửa file này:
    - Bố cục bằng <table>, KHÔNG dùng flexbox/grid (Outlook render bằng engine của Word).
    - CSS phải inline trên từng thẻ; thẻ <style> bị nhiều client lược bỏ.
    - Chiều rộng tối đa 600px.
    - Đừng nhồi nội dung quan trọng vào ảnh, nhiều client chặn ảnh mặc định.
  -->
</head>
<body style="margin:0; padding:0; background-color:#f2f4f7; -webkit-text-size-adjust:100%;">
  <!-- Dòng chữ xem trước hiện trong danh sách hộp thư, ẩn khỏi nội dung email -->
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;">{{Preheader}}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background-color:#f2f4f7;">
    <tr>
      <td align="center" style="padding:24px 12px;">

        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
               style="width:600px; max-width:100%; background-color:#ffffff; border-radius:8px; overflow:hidden;">

          <tr>
            <td align="center" style="background-color:{{PrimaryColor}}; padding:24px;">
              {{HeaderBrand}}
            </td>
          </tr>

          <tr>
            <td style="padding:32px 28px; font-family:Arial,Helvetica,sans-serif; font-size:15px; line-height:1.6; color:#1f2937;">
              {{Body}}
            </td>
          </tr>

          <tr>
            <td style="padding:20px 28px; background-color:#f8fafc; border-top:1px solid #e5e7eb; font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:1.6; color:#6b7280;">
              {{FooterMeta}}
              <div style="margin-top:8px;">
                Đây là email tự động, vui lòng không trả lời trực tiếp email này.
              </div>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>
</body>
</html>
